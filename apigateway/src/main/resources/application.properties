spring.application.name=apigateway
server.port=9000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka


spring.cloud.gateway.server.webflux.routes[0].id=CouponModule
spring.cloud.gateway.server.webflux.routes[0].uri=lb://icecreamcoupon
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/coupon/**

spring.cloud.gateway.server.webflux.routes[1].id=IceCreamModule
spring.cloud.gateway.server.webflux.routes[1].uri=lb://icecreamservice
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/icecream/**
